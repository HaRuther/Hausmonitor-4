{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Neue Rissmessstelle</h1><form method="post" action="/cracks" class="grid-form"><label>Name<input name="name" required placeholder="z. B. Riss Wohnzimmer Ost"></label><label>Ort<input name="location" placeholder="Raum, Wand, Position"></label><label>Einheit<select name="unit"><option>mm</option><option>µm</option><option>Skalenteil</option></select></label><label>Optionaler Referenzwert<input type="number" step="0.001" name="reference_value"></label><label class="wide">Beschreibung<textarea name="description" rows="4"></textarea></label><button class="wide">Messstelle anlegen</button></form></section>{% endblock %}
