{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Messung: {{point.name}}</h1><form method="post" action="/cracks/{{point.id}}/measurements" enctype="multipart/form-data" class="grid-form"><label class="wide">Datum/Uhrzeit<input type="datetime-local" name="measured_at" value="{{now}}" required></label><label>Lufttemperatur °C<input type="number" step="0.1" name="air_temp"></label><label>Messwert {{point.unit}}<input type="number" step="0.001" name="value" required></label><label class="wide">Foto<input type="file" name="photo" accept="image/*" capture="environment"></label><label class="wide">Notiz<textarea name="notes" rows="3"></textarea></label><button class="wide">Messung speichern</button></form></section>{% endblock %}
