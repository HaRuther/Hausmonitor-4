services:
  hausmonitor:
    build: .
    container_name: hausmonitor-v4
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: /data/hausmonitor.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
